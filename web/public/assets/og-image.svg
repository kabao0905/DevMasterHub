<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="220" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Content Container -->
  <g transform="translate(100, 100)">
    <!-- Brand Badge -->
    <rect x="0" y="0" width="220" height="42" rx="21" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">🚀 DEVMASTER HUB</text>

    <!-- Main Title -->
    <text x="0" y="115" font-family="'Inter', -apple-system, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Học Lập Trình Toàn Diện
    </text>
    <text x="0" y="180" font-family="'Inter', -apple-system, sans-serif" font-size="46" font-weight="800" fill="url(#accentGrad)">
      Từ Newbie Đến Senior Master
    </text>

    <!-- Subtitle -->
    <text x="0" y="240" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      20+ Lộ trình học chuyên sâu • Trình biên dịch trực tiếp • Trắc nghiệm &amp; Bài tập • AI Tutor kèm 1-1
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 300)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="180" height="50" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="25" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">💻 20+ Ngôn ngữ</text>

      <!-- Badge 2 -->
      <rect x="200" y="0" width="180" height="50" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="225" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">⚡ Trình chạy Code</text>

      <!-- Badge 3 -->
      <rect x="400" y="0" width="180" height="50" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="425" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">🤖 AI Trợ giảng</text>

      <!-- Badge 4 -->
      <rect x="600" y="0" width="200" height="50" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="625" y="32" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">🎯 Cố vấn Sự nghiệp</text>
    </g>

    <!-- URL footer -->
    <text x="0" y="420" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="500" fill="#64748b">
      🌐 https://devmaster-hub.onrender.com
    </text>
  </g>
</svg>
