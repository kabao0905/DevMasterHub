<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <nav class="flex items-center justify-between bg-white px-5 py-3 shadow-sm">
    <div class="text-lg font-extrabold text-indigo-600">Dash</div>
    <div class="hidden gap-6 text-sm font-medium text-slate-600 md:flex">
      <a href="#" class="hover:text-indigo-600">Tổng quan</a>
      <a href="#" class="hover:text-indigo-600">Báo cáo</a>
      <a href="#" class="hover:text-indigo-600">Cài đặt</a>
    </div>
    <button class="rounded-md bg-slate-100 px-3 py-1.5 text-sm font-medium md:hidden">Menu</button>
  </nav>

  <div class="mx-auto flex max-w-5xl gap-5 p-5">
    <aside class="hidden w-48 shrink-0 space-y-1 lg:block">
      <a href="#" class="block rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white">Doanh thu</a>
      <a href="#" class="block rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-white">Đơn hàng</a>
      <a href="#" class="block rounded-lg px-3 py-2 text-sm text-slate-600 hover:bg-white">Khách hàng</a>
    </aside>

    <main class="flex-1 space-y-5">
      <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
        <div class="rounded-xl bg-white p-4 shadow-sm"><p class="text-xs text-slate-500">Doanh thu</p><p class="text-xl font-bold">128tr</p></div>
        <div class="rounded-xl bg-white p-4 shadow-sm"><p class="text-xs text-slate-500">Đơn</p><p class="text-xl font-bold">342</p></div>
        <div class="rounded-xl bg-white p-4 shadow-sm"><p class="text-xs text-slate-500">Khách mới</p><p class="text-xl font-bold">87</p></div>
        <div class="rounded-xl bg-white p-4 shadow-sm"><p class="text-xs text-slate-500">Hoàn</p><p class="text-xl font-bold">1.4%</p></div>
      </div>
      <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
        <div class="flex h-40 items-end gap-2 rounded-xl bg-white p-4 shadow-sm md:col-span-2">
          <div class="h-1/3 flex-1 rounded-t bg-indigo-200"></div>
          <div class="h-2/3 flex-1 rounded-t bg-indigo-300"></div>
          <div class="h-1/2 flex-1 rounded-t bg-indigo-400"></div>
          <div class="h-full flex-1 rounded-t bg-indigo-600"></div>
          <div class="h-3/4 flex-1 rounded-t bg-indigo-500"></div>
        </div>
        <div class="flex flex-col justify-center rounded-xl bg-indigo-600 p-4 text-white shadow-sm">
          <p class="text-sm opacity-80">Mục tiêu tháng</p>
          <p class="text-3xl font-extrabold">82%</p>
        </div>
      </div>
      <p class="text-center text-xs text-slate-500">Bấm Mobile / Tablet phía trên: sidebar ẩn (hidden lg:block), lưới 4 cột thành 2 (grid-cols-2 lg:grid-cols-4).</p>
    </main>
  </div>
</body>
</html>
