<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <section class="mx-auto max-w-3xl px-6 py-14 text-center">
    <span class="inline-block rounded-full bg-sky-100 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-sky-700">Utility-first</span>
    <h1 class="mt-4 text-4xl font-extrabold leading-tight tracking-tight text-slate-900 sm:text-5xl">
      Dựng giao diện <span class="text-sky-500">không rời khỏi HTML</span>
    </h1>
    <p class="mx-auto mt-4 max-w-xl text-lg text-slate-600">
      Mỗi class làm đúng một việc: <code class="rounded bg-slate-200 px-1.5 text-sm">px-4</code> là padding ngang,
      <code class="rounded bg-slate-200 px-1.5 text-sm">rounded-lg</code> là bo góc.
    </p>
    <div class="mt-8 flex flex-wrap justify-center gap-3">
      <button class="rounded-lg bg-sky-500 px-5 py-2.5 font-semibold text-white shadow-lg shadow-sky-500/30 transition-colors hover:bg-sky-600">
        Bắt đầu học
      </button>
      <button class="rounded-lg border border-slate-300 bg-white px-5 py-2.5 font-semibold text-slate-700 transition-colors hover:border-sky-400 hover:text-sky-600">
        Xem ví dụ
      </button>
    </div>
  </section>

  <section class="mx-auto grid max-w-3xl grid-cols-1 gap-4 px-6 pb-14 md:grid-cols-3">
    <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
      <p class="text-2xl font-bold text-sky-500">Nhanh</p>
      <p class="mt-1 text-sm text-slate-500">Không phải nghĩ tên class.</p>
    </div>
    <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
      <p class="text-2xl font-bold text-violet-500">Nhất quán</p>
      <p class="mt-1 text-sm text-slate-500">Khoảng cách, màu theo một thang chung.</p>
    </div>
    <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-slate-200">
      <p class="text-2xl font-bold text-emerald-500">Nhẹ</p>
      <p class="mt-1 text-sm text-slate-500">Chỉ sinh CSS cho class đang dùng.</p>
    </div>
  </section>
</body>
</html>
