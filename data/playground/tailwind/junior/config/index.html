<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="min-h-screen bg-brand-50 font-sans text-slate-800">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef6ff', 100: '#d9eaff', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a5f' }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          },
          animation: {
            'slide-up': 'slideUp .4s ease-out both'
          },
          keyframes: {
            slideUp: { from: { opacity: 0, transform: 'translateY(16px)' }, to: { opacity: 1, transform: 'none' } }
          }
        }
      }
    };
  </script>

  <main class="mx-auto max-w-xl space-y-4 p-8">
    <h1 class="animate-slide-up text-3xl font-extrabold text-brand-900">Màu và animation riêng</h1>
    <p class="animate-slide-up text-slate-600 [animation-delay:.1s]">Các class <code class="font-mono text-brand-600">bg-brand-50</code>, <code class="font-mono text-brand-600">animate-slide-up</code> không có sẵn trong Tailwind: chúng sinh ra từ <code class="font-mono">theme.extend</code> trong config.</p>
    <div class="grid animate-slide-up grid-cols-5 gap-2 [animation-delay:.2s]">
      <div class="h-14 rounded-lg bg-brand-50 ring-1 ring-brand-100"></div>
      <div class="h-14 rounded-lg bg-brand-100"></div>
      <div class="h-14 rounded-lg bg-brand-500"></div>
      <div class="h-14 rounded-lg bg-brand-600"></div>
      <div class="h-14 rounded-lg bg-brand-900"></div>
    </div>
    <button id="toggle" class="rounded-lg bg-brand-600 px-4 py-2 font-semibold text-white hover:bg-brand-500">Bật chế độ tối (darkMode: 'class')</button>
    <div class="rounded-xl bg-white p-5 shadow dark:bg-brand-900 dark:text-white">
      Thẻ này đổi màu nhờ <code class="font-mono">dark:bg-brand-900</code>.
    </div>
  </main>
</body>
</html>
