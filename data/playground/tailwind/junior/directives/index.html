<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style type="text/tailwindcss">
    @layer base {
      body {
        @apply bg-slate-50 text-slate-800;
      }
      h2 {
        @apply text-lg font-bold;
      }
    }

    @layer components {
      .btn {
        @apply inline-flex items-center gap-2 rounded-lg px-4 py-2 font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2;
      }
      .btn-primary {
        @apply btn bg-indigo-600 text-white hover:bg-indigo-500 focus:ring-indigo-500;
      }
      .btn-outline {
        @apply btn border border-indigo-300 text-indigo-700 hover:bg-indigo-50 focus:ring-indigo-300;
      }
      .card {
        @apply rounded-2xl bg-white p-6 shadow-md ring-1 ring-slate-200;
      }
    }

    @layer utilities {
      .text-balance {
        text-wrap: balance;
      }
    }
  </style>
</head>
<body>
  <main class="mx-auto max-w-xl space-y-5 p-8">
    <div class="card space-y-3">
      <h2 class="text-balance">@apply gom nhiều utility thành một class dùng lại được</h2>
      <p class="text-slate-600">Hai nút dưới chỉ có class <code>btn-primary</code> và <code>btn-outline</code>.</p>
      <div class="flex gap-3">
        <button class="btn-primary">Lưu</button>
        <button class="btn-outline">Huỷ</button>
      </div>
    </div>
    <div class="card">
      <h2>Vẫn kết hợp được với utility</h2>
      <button class="btn-primary mt-3 w-full justify-center">Nút rộng hết khung (thêm w-full)</button>
    </div>
  </main>
</body>
</html>
