<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="min-h-screen bg-slate-950 p-6 text-white">
  <h1 class="text-2xl font-extrabold">Thư viện ảnh</h1>
  <p class="mt-1 text-sm text-slate-400">Rê chuột lên ảnh: group-hover phóng to ảnh và trượt chú thích lên.</p>

  <div class="mt-5 grid grid-cols-2 gap-4 md:grid-cols-3">
    <div class="group relative h-40 cursor-pointer overflow-hidden rounded-2xl">
      <div class="h-full w-full bg-gradient-to-br from-sky-400 to-indigo-600 transition-transform duration-500 group-hover:scale-110"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"></div>
      <p class="absolute bottom-3 left-3 translate-y-4 font-semibold opacity-0 transition-all duration-300 group-hover:translate-y-0 group-hover:opacity-100">Biển xanh</p>
    </div>
    <div class="group relative h-40 cursor-pointer overflow-hidden rounded-2xl">
      <div class="h-full w-full bg-gradient-to-br from-amber-300 to-rose-500 transition-transform duration-500 group-hover:scale-110"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"></div>
      <p class="absolute bottom-3 left-3 translate-y-4 font-semibold opacity-0 transition-all duration-300 group-hover:translate-y-0 group-hover:opacity-100">Hoàng hôn</p>
    </div>
    <div class="group relative h-40 cursor-pointer overflow-hidden rounded-2xl">
      <div class="h-full w-full bg-gradient-to-br from-emerald-300 to-teal-700 transition-transform duration-500 group-hover:scale-110"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"></div>
      <p class="absolute bottom-3 left-3 translate-y-4 font-semibold opacity-0 transition-all duration-300 group-hover:translate-y-0 group-hover:opacity-100">Rừng thông</p>
    </div>
  </div>

  <h2 class="mt-8 font-bold">Animation có sẵn</h2>
  <div class="mt-3 flex flex-wrap items-center gap-6">
    <div class="h-8 w-8 animate-spin rounded-full border-4 border-sky-400 border-t-transparent" title="animate-spin"></div>
    <span class="relative flex h-4 w-4"><span class="absolute h-full w-full animate-ping rounded-full bg-rose-400 opacity-75"></span><span class="relative h-4 w-4 rounded-full bg-rose-500"></span></span>
    <div class="h-4 w-28 animate-pulse rounded bg-slate-600"></div>
    <div class="animate-bounce text-2xl">↓</div>
    <button class="rounded-lg bg-sky-500 px-4 py-2 font-semibold transition hover:-translate-y-1 hover:shadow-lg hover:shadow-sky-500/40 active:scale-95">Nhấn thử</button>
  </div>
  <p class="mt-3 text-xs text-slate-500">animate-spin · animate-ping · animate-pulse · animate-bounce · hover:-translate-y-1 · active:scale-95</p>
</body>
</html>
