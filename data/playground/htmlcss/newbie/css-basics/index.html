<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <article class="card">
      <span class="badge">Mới</span>
      <h1 class="title" id="main-title">Khoá học CSS</h1>
      <p>Rê chuột lên thẻ để xem hiệu ứng nổi lên.</p>
      <ul class="list">
        <li>Selector: phần tử, .class, #id</li>
        <li>Pseudo-class: :hover, :nth-child()</li>
        <li>Pseudo-element: ::before</li>
        <li>Box model: margin, border, padding</li>
      </ul>
      <a class="btn" href="#">Bắt đầu học</a>
    </article>

    <section class="box-model" aria-label="Minh hoạ box model">
      <div class="layer margin">margin
        <div class="layer border">border
          <div class="layer padding">padding
            <div class="layer content">content</div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
