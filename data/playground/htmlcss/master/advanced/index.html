<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="row">
      <div class="gradient-border">
        <h2>@property</h2>
        <p>Viền gradient xoay nhờ biến CSS có kiểu &lt;angle&gt;.</p>
      </div>

      <div class="panel">
        <h2>Popover API</h2>
        <button class="btn" popovertarget="tip">Mở popover</button>
        <div id="tip" popover>Popover tự đóng khi bấm ra ngoài hoặc nhấn Esc. Không cần JavaScript.</div>
      </div>

      <div class="panel">
        <h2>View Transitions</h2>
        <button class="btn" id="swap">Đổi bố cục</button>
        <div class="tiles" id="tiles">
          <span style="view-transition-name: a">A</span>
          <span style="view-transition-name: b">B</span>
          <span style="view-transition-name: c">C</span>
        </div>
      </div>
    </section>

    <h2 class="scroll-title">Scroll-driven animation: cuộn khung bên dưới</h2>
    <div class="scroller">
      <div class="reveal-on-scroll">Thẻ 1 hiện dần khi cuộn tới</div>
      <div class="reveal-on-scroll">Thẻ 2</div>
      <div class="reveal-on-scroll">Thẻ 3</div>
      <div class="reveal-on-scroll">Thẻ 4</div>
      <div class="reveal-on-scroll">Thẻ 5</div>
    </div>
    <p class="note" id="note"></p>
  </main>
</body>
</html>
