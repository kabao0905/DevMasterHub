<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>CSS Paint API</h1>
    <p class="muted">Nền chấm bi được vẽ bằng một paint worklet. Kéo thanh trượt để đổi biến CSS, worklet tự vẽ lại.</p>

    <div class="dotted-bg" id="box">
      <span>background-image: paint(dots)</span>
    </div>

    <div class="controls">
      <label>Kích thước chấm <input type="range" id="size" min="1" max="8" value="3"></label>
      <label>Khoảng cách <input type="range" id="spacing" min="10" max="40" value="20"></label>
      <label>Màu <input type="color" id="color" value="#38bdf8"></label>
    </div>
    <p class="muted" id="status"></p>
  </main>
</body>
</html>
