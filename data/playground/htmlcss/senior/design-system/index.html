<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Mini Design System</h1>

    <section>
      <h2>Button</h2>
      <div class="row">
        <button class="btn btn--sm">Nhỏ</button>
        <button class="btn">Mặc định</button>
        <button class="btn btn--lg">Lớn</button>
        <button class="btn btn--outline">Viền</button>
        <button class="btn btn--ghost">Ghost</button>
        <button class="btn btn--danger">Xoá</button>
      </div>
    </section>

    <section>
      <h2>Input</h2>
      <label class="input">
        <span class="input__label">Tên dự án</span>
        <input class="input__field" placeholder="vd: devmaster-ui">
      </label>
    </section>

    <section>
      <h2>Card + Modal + Toast</h2>
      <article class="card">
        <h3>Phát hành v2.0</h3>
        <p>Thêm 12 component mới và chế độ tối.</p>
        <div class="row">
          <button class="btn btn--sm" id="open-modal">Xem chi tiết</button>
          <button class="btn btn--sm btn--outline" id="toast-btn">Hiện toast</button>
        </div>
      </article>
    </section>
  </main>

  <dialog class="modal" id="modal">
    <h3>Chi tiết bản phát hành</h3>
    <p>Modal dùng thẻ &lt;dialog&gt; có sẵn: tự khoá focus và đóng bằng phím Esc.</p>
    <form method="dialog"><button class="btn">Đóng</button></form>
  </dialog>

  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
