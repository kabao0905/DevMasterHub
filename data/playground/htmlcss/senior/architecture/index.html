<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="page__bar">
      <h1 class="page__title">Design tokens + BEM</h1>
      <button class="button button--ghost" id="theme">Đổi giao diện sáng / tối</button>
    </div>

    <div class="grid">
      <article class="card">
        <h2 class="card__title">Block</h2>
        <p class="card__text"><code>.card</code> là một khối độc lập, dùng lại ở bất kỳ đâu.</p>
      </article>
      <article class="card card--featured">
        <h2 class="card__title card__title--highlighted">Modifier</h2>
        <p class="card__text"><code>.card--featured</code> đổi giao diện mà không viết lại khối.</p>
      </article>
      <article class="card">
        <h2 class="card__title">Element</h2>
        <p class="card__text"><code>.card__title</code> chỉ sống bên trong <code>.card</code>.</p>
      </article>
    </div>

    <section class="offscreen-section card">
      <h2 class="card__title">content-visibility: auto</h2>
      <p class="card__text">Phần ngoài màn hình được trình duyệt bỏ qua khi vẽ cho tới khi cuộn tới.</p>
    </section>
  </main>
</body>
</html>
