<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="cards">
      <article class="card">
        <h2 class="title">Nesting</h2>
        <p class="body">Viết CSS lồng nhau như SCSS, không cần công cụ build.</p>
      </article>
      <article class="card featured">
        <h2 class="title">color-mix()</h2>
        <p class="body">Rê chuột vào nút: màu tối hơn được trộn ngay trong CSS.</p>
        <button class="btn">Nút chính</button>
      </article>
    </div>

    <form class="form" novalidate>
      <h2>:has() — chọn phần tử cha</h2>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Gõ thử một email sai" required>
        <small>Khung đỏ lên khi ô bên trong không hợp lệ, không cần JavaScript.</small>
      </div>
      <label class="check"><input type="checkbox"> Nhận bản tin (thẻ đổi màu khi được chọn)</label>
    </form>
  </main>
</body>
</html>
