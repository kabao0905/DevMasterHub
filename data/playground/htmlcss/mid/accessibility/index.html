<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Bỏ qua, tới nội dung chính</a>

  <header class="top">
    <strong>A11y Shop</strong>
    <button class="icon-btn" aria-label="Mở giỏ hàng" aria-expanded="false" id="cart-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
    </button>
  </header>

  <main id="main-content">
    <p class="hint">Thử dùng phím Tab để đi qua trang: link "Bỏ qua" hiện ra đầu tiên, viền focus luôn rõ.</p>

    <form class="form" id="form" novalidate aria-labelledby="form-title">
      <h1 id="form-title">Đăng ký nhận ưu đãi</h1>
      <div class="field">
        <label for="email">Email <span aria-hidden="true">*</span></label>
        <input id="email" type="email" required aria-describedby="email-help email-error" aria-invalid="false" autocomplete="email">
        <small id="email-help">Chúng tôi không chia sẻ email của bạn.</small>
        <p id="email-error" class="error" role="alert"></p>
      </div>
      <button type="submit">Đăng ký</button>
      <p id="status" role="status" class="ok"></p>
    </form>
  </main>
</body>
</html>
