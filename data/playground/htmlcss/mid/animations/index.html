<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="toolbar">
      <button class="btn" id="replay">Chạy lại hiệu ứng</button>
      <div class="spinner" role="status" aria-label="Đang tải"></div>
    </div>
    <div class="cards" id="cards">
      <article class="card"><h2>Transition</h2><p>Đổi trạng thái mượt mà khi rê chuột.</p></article>
      <article class="card"><h2>@keyframes</h2><p>Hiệu ứng nhiều bước tự chạy.</p></article>
      <article class="card"><h2>Stagger</h2><p>Mỗi thẻ trễ hơn thẻ trước một chút.</p></article>
      <article class="card"><h2>transform</h2><p>Dùng GPU nên chạy mượt 60fps.</p></article>
    </div>
  </main>
</body>
</html>
