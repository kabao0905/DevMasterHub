<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <strong>GridAdmin</strong>
      <a class="active" href="#">Tổng quan</a>
      <a href="#">Đơn hàng</a>
      <a href="#">Khách hàng</a>
      <a href="#">Cài đặt</a>
    </aside>
    <header class="header">
      <h1>Tổng quan</h1>
      <span class="user">Xin chào, Lan</span>
    </header>
    <main class="main">
      <div class="widgets">
        <div class="widget featured"><span>Doanh thu tháng</span><b>128.5 tr</b><small>+12% so với tháng trước</small></div>
        <div class="widget"><span>Đơn mới</span><b>342</b></div>
        <div class="widget"><span>Khách mới</span><b>87</b></div>
        <div class="widget"><span>Tỉ lệ hoàn</span><b>1.4%</b></div>
        <div class="widget"><span>Đánh giá</span><b>4.8★</b></div>
      </div>
    </main>
    <footer class="footer">grid-template-areas: "sidebar header" "sidebar main" "sidebar footer"</footer>
  </div>
</body>
</html>
