<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <strong class="brand">FlexShop</strong>
    <ul class="nav-links">
      <li><a href="#">Sản phẩm</a></li>
      <li><a href="#">Giá</a></li>
      <li><a href="#">Hỗ trợ</a></li>
    </ul>
  </nav>

  <main class="page">
    <section class="playground">
      <div class="controls">
        <label>justify-content
          <select id="justify">
            <option>flex-start</option>
            <option>center</option>
            <option>flex-end</option>
            <option selected>space-between</option>
            <option>space-around</option>
            <option>space-evenly</option>
          </select>
        </label>
        <label>align-items
          <select id="align">
            <option>stretch</option>
            <option>flex-start</option>
            <option selected>center</option>
            <option>flex-end</option>
          </select>
        </label>
        <label>flex-direction
          <select id="direction">
            <option selected>row</option>
            <option>column</option>
          </select>
        </label>
      </div>
      <div class="demo" id="demo">
        <div class="item">1</div>
        <div class="item tall">2</div>
        <div class="item">3</div>
      </div>
      <code id="css-out"></code>
    </section>

    <section class="card-container">
      <article class="card">flex: 1 1 200px</article>
      <article class="card">Thẻ tự xuống dòng</article>
      <article class="card">khi hết chỗ (flex-wrap)</article>
    </section>
  </main>
</body>
</html>
